[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-analyser-tools"
version = "0.1.1"
description = "Deterministic MetaTrader 5 strategy report analytics"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=4.9",
  "numpy>=1.24",
]

[tool.setuptools.packages.find]
include = ["analyser*"]

[tool.setuptools.package-data]
analyser = ["assets/*.png"]

[project.optional-dependencies]
test = ["coverage>=7"]
charts = ["matplotlib>=3.7"]

[tool.coverage.run]
branch = true
source = ["analyser"]
omit = [
  "analyser/simulations/money_management.py",
  "analyser/simulations/what_if.py",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]
